# Builds and tests the shared engine (RNGCore + rngcheck) on macOS, Linux and Windows,
# builds the macOS app on macOS, and checks the engine against the original Python
# notebook from jasmithc/mhgu-rng with tools/compare.py.
#
# Kept to as few dependencies as possible: Swift, Python and curl come preinstalled on
# GitHub's macOS and Ubuntu runners. Windows runners have Python and curl but no Swift,
# so that job installs the official toolchain with compnerd/gha-setup-swift (maintained
# by the Swift-on-Windows developers), pinned to an exact commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NOTEBOOK_URL: https://raw.githubusercontent.com/jasmithc/mhgu-rng/main/mhxx-rng.ipynb

jobs:
  macos:
    name: macOS (engine + app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift --version && python3 --version
      - name: Build (engine, rngcheck and the macOS app)
        run: swift build -c release
      - name: Unit tests
        run: swift test
      - name: Compare with the Python notebook
        run: |
          curl -sSfL -o "$RUNNER_TEMP/mhxx-rng.ipynb" "$NOTEBOOK_URL"
          python3 tools/compare.py "$RUNNER_TEMP/mhxx-rng.ipynb"
      - name: Build the .app bundle
        run: ./build_app.sh

  linux:
    name: Linux (engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift --version && python3 --version
      - name: Build (engine and rngcheck)
        run: swift build -c release
      - name: Unit tests
        run: swift test
      - name: Compare with the Python notebook
        run: |
          curl -sSfL -o "$RUNNER_TEMP/mhxx-rng.ipynb" "$NOTEBOOK_URL"
          python3 tools/compare.py "$RUNNER_TEMP/mhxx-rng.ipynb"

  windows:
    name: Windows (engine)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.1-release
          swift-build: 6.1-RELEASE
      - run: swift --version && python --version
      - name: Build (engine and rngcheck)
        run: swift build -c release
      - name: Unit tests
        run: swift test
      - name: Compare with the Python notebook
        run: |
          curl -sSfL -o "$RUNNER_TEMP/mhxx-rng.ipynb" "$NOTEBOOK_URL"
          python tools/compare.py "$RUNNER_TEMP/mhxx-rng.ipynb"
