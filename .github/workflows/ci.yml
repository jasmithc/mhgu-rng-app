# Builds and tests the shared engine (RNGCore + rngcheck) on macOS, Linux and Windows,
# builds the macOS app on macOS and the Windows app on Windows, and checks the engine
# against the original Python notebook from jasmithc/mhgu-rng with tools/compare.py.
# The Windows app is packaged, smoke-tested and uploaded as the "windows-app" artifact.
#
# Kept to as few dependencies as possible: Swift, Python and curl come preinstalled on
# GitHub's macOS and Ubuntu runners. Windows runners have Python and curl but no Swift,
# so that job installs the official toolchain with compnerd/gha-setup-swift (maintained
# by the Swift-on-Windows developers), pinned to an exact commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NOTEBOOK_URL: https://raw.githubusercontent.com/jasmithc/mhgu-rng/main/mhxx-rng.ipynb

jobs:
  macos:
    name: macOS (engine + Mac and iPhone apps)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift --version && python3 --version
      - name: Build (engine, rngcheck and the macOS app)
        run: swift build -c release
      - name: Unit tests
        run: swift test
      - name: Compare with the Python notebook
        run: |
          curl -sSfL -o "$RUNNER_TEMP/mhxx-rng.ipynb" "$NOTEBOOK_URL"
          python3 tools/compare.py "$RUNNER_TEMP/mhxx-rng.ipynb"
      - name: Build the .app bundle
        run: ./build_app.sh
      - name: Build the iPhone/iPad app (Simulator, unsigned)
        working-directory: ios/MHGUCharmsRNG.swiftpm
        run: xcodebuild -scheme MHGUCharmsRNG -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build -quiet

  linux:
    name: Linux (engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift --version && python3 --version
      - name: Build (engine and rngcheck)
        run: swift build -c release
      - name: Unit tests
        run: swift test
      - name: Compare with the Python notebook
        run: |
          curl -sSfL -o "$RUNNER_TEMP/mhxx-rng.ipynb" "$NOTEBOOK_URL"
          python3 tools/compare.py "$RUNNER_TEMP/mhxx-rng.ipynb"

  windows:
    name: Windows (engine + Windows app)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.1-release
          swift-build: 6.1-RELEASE
      - run: swift --version && python --version
      - name: Build (engine and rngcheck)
        run: swift build -c release
      - name: Unit tests
        run: swift test
      - name: Compare with the Python notebook
        run: |
          curl -sSfL -o "$RUNNER_TEMP/mhxx-rng.ipynb" "$NOTEBOOK_URL"
          python tools/compare.py "$RUNNER_TEMP/mhxx-rng.ipynb"
      - name: Build, package and smoke-test the Windows app
        shell: pwsh
        run: ./build_windows.ps1 -SmokeTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-app
          if-no-files-found: ignore
          path: |
            dist/*.zip
            .build/windows-package/smoke/
